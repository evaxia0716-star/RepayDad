<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>還款卡</title>
<meta property="og:title" content="還款卡">
<meta property="og:description" content="每月還款進度與剩餘金額">
<meta name="theme-color" content="#F6EFDF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6EFDF;        /* 米黃 */
    --grid:#E6DCC4;         /* 方格線 */
    --card:#FFFDF8;
    --ink:#2B3238;
    --ink-2:#6B6F72;
    --ink-3:#A3A6A8;
    --rose:#C9706C;         /* 玫瑰：封面、章 */
    --rose-soft:#F3D9D6;
    --rose-deep:#A85351;
    --sage:#5F8C74;         /* 鼠尾草綠：已還 */
    --sage-soft:#DCE9E0;
    --mustard:#D39B2E;      /* 芥末：待打卡 */
    --mustard-soft:#FBEBC8;
    --lineapp:#06C755;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:18px 14px 64px;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:18px 18px;}
  .wrap{max-width:560px;margin:0 auto}

  /* ── 標題 ── */
  .top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 4px 14px}
  .top h1{margin:0;font-family:"Noto Serif TC",serif;font-size:26px;font-weight:900;letter-spacing:.12em;color:var(--rose-deep)}
  .top .who{font-size:13px;color:var(--ink-2);background:var(--card);border:1px solid var(--grid);padding:4px 12px;border-radius:999px}

  /* ── 卡片：郵票鋸齒邊（用遮罩把上下邊緣剪成半圓） ── */
  .sh{margin-top:20px;filter:drop-shadow(0 6px 12px rgba(120,80,60,.13)) drop-shadow(0 1px 1px rgba(0,0,0,.05))}
  .sh:first-of-type{margin-top:0}
  .lace{position:relative;background:var(--card);
    -webkit-mask:
      radial-gradient(circle at 9px 0,transparent 6px,#000 6.6px) top/18px 12px repeat-x,
      radial-gradient(circle at 9px 12px,transparent 6px,#000 6.6px) bottom/18px 12px repeat-x,
      linear-gradient(#000,#000) center/100% calc(100% - 24px) no-repeat;
    mask:
      radial-gradient(circle at 9px 0,transparent 6px,#000 6.6px) top/18px 12px repeat-x,
      radial-gradient(circle at 9px 12px,transparent 6px,#000 6.6px) bottom/18px 12px repeat-x,
      linear-gradient(#000,#000) center/100% calc(100% - 24px) no-repeat;}

  /* ── 封面卡（淡粉底、深玫瑰字） ── */
  .cover{padding:32px 24px 30px;color:var(--ink);background:var(--rose-soft);overflow:hidden;position:relative}
  .cover .label{font-size:13px;color:var(--rose-deep);letter-spacing:.1em;font-weight:700}
  .cover .big{font-family:"Noto Serif TC",serif;font-size:54px;font-weight:900;line-height:1.05;letter-spacing:-.01em;margin:6px 0 6px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;color:var(--rose-deep)}
  .cover .big small{font-family:"Noto Sans TC",sans-serif;font-size:16px;font-weight:500;color:var(--ink-2)}
  .cover .sub{font-size:13px;color:var(--ink-2);margin-bottom:18px;min-height:18px}
  .bar{height:10px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--rose);width:0;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .barlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums}
  /* 多還試算 */
  .sim{margin-top:18px;padding-top:14px;border-top:1px dashed rgba(168,83,81,.35)}
  .sim .t{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
  .sim .t b{color:var(--rose-deep);font-variant-numeric:tabular-nums}
  .sim input[type=range]{width:100%;margin:8px 0 4px;accent-color:var(--rose)}
  .sim .r{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .sim .r b{color:var(--rose-deep)}
  .paidoff{position:absolute;right:22px;top:26px;border:3px solid var(--rose-deep);color:var(--rose-deep);padding:5px 12px;font-weight:900;font-size:20px;transform:rotate(-10deg);border-radius:8px;letter-spacing:.14em}

  /* ── 戳記卡 ── */
  .book{padding:28px 14px 26px}
  h2{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:900;color:var(--ink);margin:0 0 4px;padding:0 8px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.06em}
  h2 small{font-family:"Noto Sans TC",sans-serif;font-weight:400;font-size:12px;color:var(--ink-3);letter-spacing:0}
  .stats{display:flex;gap:8px;padding:12px 6px 18px;flex-wrap:wrap}
  .chip{flex:1;min-width:90px;background:var(--paper);border-radius:10px;padding:10px 8px;text-align:center}
  .chip b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
  .chip span{font-size:11px;color:var(--ink-2)}
  .chip.sage b{color:var(--sage)} .chip.rose b{color:var(--rose-deep)} .chip.mustard b{color:var(--mustard)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px}
  @media (min-width:440px){.grid{grid-template-columns:repeat(4,1fr)}}
  .slot{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 2px 6px}
  .slot .ym{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:8px;font-weight:500}
  .ring{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;position:relative;
    border:2px dashed var(--grid);color:var(--ink-3)}
  .slot.future .ring{font-size:12px;font-weight:500}
  .slot.due .ring{border:2.5px dashed var(--mustard);background:var(--mustard-soft);color:var(--mustard);font-size:12px;font-weight:700;animation:breathe 2.4s ease-in-out infinite}
  .slot.partial .ring{border:2.5px dashed var(--mustard);background:var(--mustard-soft);color:var(--mustard);font-size:13px}
  .slot.done .ring{border:0;background:var(--sage);color:#fff;transform:rotate(-8deg);
    box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sage),0 4px 10px rgba(95,140,116,.35)}
  .slot.done .ring.pop{animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes stamp{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(211,155,46,.35)}50%{box-shadow:0 0 0 8px rgba(211,155,46,0)}}
  .slot .amt{font-size:13px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;min-height:18px;color:var(--ink-3)}
  .slot .amt:empty{display:none}
  .slot.done .amt{color:var(--sage)} .slot.due .amt,.slot.partial .amt{color:var(--mustard)}
  .slot.tap{cursor:pointer}
  .slot.tap .ring{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--card)}
  .slot.tap:hover .ring,.slot.tap:focus-visible .ring{background:var(--ink);color:#fff}
  .slot.tap:focus-visible{outline:none}
  .slot .tapHint{font-size:11px;color:var(--ink-2);margin-top:4px}
  .more{display:block;margin:12px auto 4px;border:1px solid var(--grid);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:7px 16px;font:inherit;font-size:12px;cursor:pointer}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 8px 0;font-size:11px;color:var(--ink-3)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}

  /* ── 流水帳（鼠尾草綠內頁） ── */
  .ledgerCard{background:var(--sage-soft);padding:28px 0 26px}
  .ledgerCard h2{padding:0 20px 8px}
  .lhead,.row{display:grid;grid-template-columns:58px 1fr 74px 80px;gap:8px;padding:10px 18px;align-items:baseline;font-variant-numeric:tabular-nums}
  .lhead{font-size:11px;color:var(--sage);border-bottom:1px dashed rgba(95,140,116,.4);padding-top:0}
  .lhead span:nth-child(3),.lhead span:nth-child(4),.row .a,.row .bal{text-align:right}
  .row{font-size:14px;border-bottom:1px dashed rgba(95,140,116,.25)}
  .row:last-child{border-bottom:0}
  .row .d{color:var(--ink-2);font-size:13px}
  .row .n{color:var(--ink-2);font-size:12px;line-height:1.4;word-break:break-all}
  .row .a{font-weight:700;color:var(--sage)}
  .row .bal{color:var(--ink);font-weight:500}
  /* ── 數據卡 ── */
  .chartCard{padding:28px 16px 24px}
  .tabs{display:flex;gap:6px;padding:8px 4px 14px}
  .tabs button{flex:1;border:1.5px solid var(--grid);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:8px 0;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chart{width:100%;height:auto;display:block}
  .chart text{font-family:"Noto Sans TC",sans-serif}
  .chartNote{font-size:12px;color:var(--ink-2);padding:10px 4px 0;line-height:1.6}
  .empty{padding:22px 20px;color:var(--ink-2);font-size:14px;text-align:center;line-height:1.7}

  /* ── 傳給爸爸 ── */
  .share-btn{margin:22px 0 0;width:100%;border:2px solid var(--rose);background:var(--card);color:var(--rose-deep);border-radius:999px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .share-btn svg{width:20px;height:20px}
  .foot{margin-top:14px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;padding:0 4px}
  .foot a{color:var(--ink-3)}
  .copy{margin-top:26px;text-align:center;font-size:11px;color:var(--ink-3);line-height:1.8;letter-spacing:.04em}
  .copy b{font-weight:700;color:var(--ink-2)}

  /* ── 抽屜 ── */
  .mask{position:fixed;inset:0;background:rgba(43,50,56,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .mask.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:22px 20px 30px;max-height:92vh;overflow:auto}
  @media (min-width:600px){.mask{align-items:center}.sheet{border-radius:16px}}
  .sheet h3{margin:0 0 16px;font-family:"Noto Serif TC",serif;font-size:19px;font-weight:900;color:var(--rose-deep)}
  .f{margin-bottom:12px}
  .f label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px}
  .f input,.f select,.f textarea{width:100%;border:1.5px solid var(--grid);border-radius:10px;padding:12px 13px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .f textarea{min-height:160px;resize:vertical;line-height:1.55}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--rose)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btns{display:flex;gap:10px;margin-top:8px}
  .btns button{flex:1;border:0;border-radius:999px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .btn-go{background:var(--sage);color:#fff}
  .btn-go[disabled]{opacity:.5}
  .btn-line{background:var(--lineapp);color:#fff}
  .btn-x,.btn-alt{background:var(--paper);color:var(--ink)}
  .err{color:var(--rose-deep);font-size:13px;min-height:18px;margin-top:6px}
  .hint{font-size:12px;color:var(--ink-3);margin:-4px 0 12px;line-height:1.5}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10;white-space:nowrap}
  .toast.show{opacity:1}
  .loading{padding:80px 20px;text-align:center;color:var(--ink-2);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">讀取中…</div></div>

<div class="mask" id="mask">
  <div class="sheet">
    <h3 id="sheetTitle">打卡</h3>
    <div class="two">
      <div class="f"><label>還款日期</label><input type="date" id="fDate"></div>
      <div class="f"><label>算在哪一期</label><select id="fPeriod"></select></div>
    </div>
    <div class="f"><label>金額（元）</label><input type="number" inputmode="numeric" id="fAmount" placeholder="例如 15000"></div>
    <div class="f"><label>備註（可空）</label><input type="text" id="fNote" placeholder="例如：多還 5,000"></div>
    <div class="f"><label>PIN</label><input type="password" inputmode="numeric" id="fPin" autocomplete="off"></div>
    <div class="err" id="fErr"></div>
    <div class="btns">
      <button class="btn-x" id="btnX">取消</button>
      <button class="btn-go" id="btnGo">蓋章打卡</button>
    </div>
  </div>
</div>

<div class="mask" id="shareMask">
  <div class="sheet">
    <h3 id="shareTitle">傳給爸爸</h3>
    <div class="f"><label>訊息內容（可以改）</label><textarea id="shareText"></textarea></div>
    <div class="hint">最後一行網址 LINE 會自動變成可以點的連結，爸爸按下去就進這個網頁。</div>
    <div class="btns"><button class="btn-line" id="btnLine">用 LINE 傳</button></div>
    <div class="btns">
      <button class="btn-alt" id="btnCopy">複製文字</button>
      <button class="btn-alt" id="btnShare">其他 App</button>
      <button class="btn-x" id="btnShareX">關閉</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════ 只需要改這一行 ═══════════ */
const API_URL = '請貼上 Apps Script 網頁應用程式網址';
/* ═════════════════════════════════════ */

const PAGE_URL = location.origin + location.pathname;

const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString('zh-TW');
let S = null, R = [], justStamped = null, showAll = false, simVal = null, chartTab = 'month';

function ymNow(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymdNow(){ const d=new Date(); return ymNow()+'-'+String(d.getDate()).padStart(2,'0'); }
function addMonths(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymCmp(a,b){ return a<b?-1:a>b?1:0; }
function ymDisp(ym){ return ym.replace('-','/'); }

async function load(){
  try{
    const res = await fetch(API_URL + (API_URL.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
    const data = await res.json();
    if(!data.ok) throw new Error(data.error||'讀取失敗');
    S = data.settings; R = data.records;
    render();
  }catch(err){
    $('#app').innerHTML = `<div class="loading">讀不到資料。<br><small>${escape(String(err.message||err))}</small><br><br>
      <small>確認 index.html 裡的 API_URL 已換成 Apps Script 網址，且部署時「誰可以存取」選「所有人」。</small></div>`;
  }
}

function compute(){
  const paid = R.reduce((a,r)=>a+r.amount,0);
  const remaining = Math.max(S.total - paid, 0);
  const byPeriod = {};
  R.forEach(r=>{ byPeriod[r.period]=(byPeriod[r.period]||0)+r.amount; });

  const start = /^\d{4}-\d{2}$/.test(S.startMonth||'') ? S.startMonth : ymNow();
  const now = ymNow();
  let end = ymCmp(now,start)>0 ? now : start;
  R.forEach(r=>{ if(ymCmp(r.period,end)>0) end=r.period; });

  let periods = null, finishMonth = null;
  if(S.monthly){
    periods = Math.ceil(S.total / S.monthly);
    const planEnd = addMonths(start, periods-1);
    if(ymCmp(planEnd,end)>0) end = planEnd;
    if(remaining>0){
      const nextUnpaid = firstUnpaid(start,end,byPeriod);
      finishMonth = addMonths(nextUnpaid, Math.ceil(remaining/S.monthly)-1);
    }
  }else if(remaining>0){
    end = addMonths(end,1);
  }

  const months=[];
  for(let ym=start; ymCmp(ym,end)<=0; ym=addMonths(ym,1)) months.push(ym);
  const nextUp = remaining>0 ? firstUnpaid(start,end,byPeriod) : null;
  return {paid,remaining,byPeriod,months,periods,finishMonth,now,nextUp};
}
function firstUnpaid(start,end,byPeriod){
  for(let ym=start; ymCmp(ym,end)<=0; ym=addMonths(ym,1)){
    if(!S.monthly ? !(byPeriod[ym]>0) : (byPeriod[ym]||0)<S.monthly) return ym;
  }
  return addMonths(end,1);
}
// 日期是自己約的，所以沒有「逾期」：到了的月份沒打卡一律「待打卡」
function status(ym,sum,now){
  if(S.monthly ? sum>=S.monthly : sum>0) return 'done';
  if(sum>0) return 'partial';
  return ymCmp(ym,now)<=0 ? 'due' : 'future';
}

function render(){
  const c = compute();
  const pct = S.total ? Math.min(100, c.paid/S.total*100) : 0;
  const doneCount = c.months.filter(ym=>status(ym,c.byPeriod[ym]||0,c.now)==='done').length;

  let futureSeen = 0, hidden = 0;
  const grid = c.months.map(ym=>{
    const sum = c.byPeriod[ym]||0;
    const st = status(ym,sum,c.now);
    if(st==='future' && ym!==c.nextUp){ futureSeen++; if(!showAll && futureSeen>2){ hidden++; return ''; } }
    const ringText = {done:'✓',partial:'半',due:'待打卡',future:'未到'}[st];
    const amt = sum>0 ? fmt(sum) : (S.monthly ? fmt(S.monthly) : '');
    const tap = c.remaining>0 && ym===c.nextUp;
    return `<div class="slot ${st}${tap?' tap':''}" ${tap?`data-ym="${ym}" role="button" tabindex="0"`:''}>
      <div class="ym">${ymDisp(ym)}</div>
      <div class="ring${st==='done'&&justStamped===ym?' pop':''}">${ringText}</div>
      <div class="amt">${amt}</div>
      ${tap ? '<div class="tapHint">點圈蓋章</div>' : ''}
    </div>`;
  }).join('');

  const asc = [...R].sort((a,b)=> (a.date+a.ts).localeCompare(b.date+b.ts));
  let running = S.total;
  const rowsAsc = asc.map(r=>{ running -= r.amount; return {...r, bal: Math.max(running,0)}; });
  const ledger = rowsAsc.length
    ? `<div class="lhead"><span>日期</span><span>期別</span><span>還款</span><span>餘額</span></div>` +
      rowsAsc.reverse().map(r=>
        `<div class="row"><span class="d">${r.date.slice(5).replace('-','/')}<br><small style="color:var(--ink-3)">${r.date.slice(0,4)}</small></span>
         <span class="n">${ymDisp(r.period)}${r.note?'<br>'+escape(r.note):''}</span>
         <span class="a">${fmt(r.amount)}</span><span class="bal">${fmt(r.bal)}</span></div>`).join('')
    : `<div class="empty">還沒有任何一筆。<br>匯款給${escape(S.lender)}之後，點上面 ${ymDisp(c.nextUp||'')} 的圈圈蓋第一個章。</div>`;

  // 多還試算：預設值＝每月應還，沒有就用過去平均，再沒有就 15,000
  const avg = R.length ? Math.round(c.paid / new Set(R.map(r=>r.period)).size / 1000) * 1000 : 0;
  const base = S.monthly || avg || 15000;
  const sim = { min: 5000, max: Math.max(50000, Math.ceil(base/1000)*1000*2), val: simVal || base };

  $('#app').innerHTML = `
    <div class="top"><h1>還款卡</h1><span class="who">${escape(S.borrower||'')} → ${escape(S.lender)}</span></div>

    <div class="sh"><section class="lace cover">
      ${c.remaining===0 && S.total ? '<div class="paidoff">已還清</div>' : ''}
      <div class="label">還欠${escape(S.lender)}</div>
      <div class="big">${fmt(c.remaining)}<small>元</small></div>
      <div class="sub">${c.finishMonth ? `照目前進度，預計 ${ymDisp(c.finishMonth)} 還清` : '每次匯款後打卡，餘額自動更新'}</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="barlabel"><span>已還 ${Math.round(pct)}%</span><span>總額 ${fmt(S.total)}</span></div>
      ${c.remaining>0 ? `<div class="sim">
        <div class="t"><span>試算：每月還</span><b id="simLabel"></b></div>
        <input type="range" id="sim" min="${sim.min}" max="${sim.max}" step="1000" value="${sim.val}">
        <div class="r" id="simOut"></div>
      </div>` : ''}
    </section></div>

    <div class="sh"><section class="lace book">
      <h2>每月戳記 <small>${c.nextUp ? '下一期 '+ymDisp(c.nextUp) : ''}</small></h2>
      <div class="stats">
        <div class="chip sage"><b>${fmt(c.paid)}</b><span>已還金額</span></div>
        <div class="chip rose"><b>${doneCount}${c.periods?' / '+c.periods:''}</b><span>已還期數</span></div>
      </div>
      <div class="grid">${grid}</div>
      ${hidden ? `<button class="more" id="btnMore">還有 ${hidden} 期未到，全部展開</button>` : (showAll && c.months.length>6 ? `<button class="more" id="btnMore">收起未到的月份</button>` : '')}
      <div class="legend">
        <span><i style="background:var(--sage)"></i>已還</span>
        <span><i style="background:var(--mustard)"></i>待打卡</span>
        <span><i style="border:1.5px dashed var(--ink-3)"></i>未到</span>
      </div>
    </section></div>

    <div class="sh"><section class="lace ledgerCard">
      <h2>流水帳 <small>${R.length ? R.length+' 筆' : ''}</small></h2>
      ${ledger}
    </section></div>

    <div class="sh"><section class="lace chartCard">
      <h2>數據 <small>點上方切換</small></h2>
      <div class="tabs">
        <button data-tab="month" class="${chartTab==='month'?'on':''}">每月還款</button>
        <button data-tab="cum" class="${chartTab==='cum'?'on':''}">累積進度</button>
        <button data-tab="year" class="${chartTab==='year'?'on':''}">年度合計</button>
      </div>
      ${drawChart(chartTab, c)}
    </section></div>

    <button class="share-btn" id="btnShareAny">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      把目前進度傳給${escape(S.lender)}
    </button>
    <div class="foot"><span>資料存在自己的 Google Sheet</span><a href="javascript:location.reload()">重新整理</a></div>
    <div class="copy">© ${new Date().getFullYear()} <b>${escape(S.borrower||'')}</b>　還款卡<br>僅供對帳使用，內容不作為任何法律文件</div>`;

  requestAnimationFrame(()=>{ $('#bar').style.width = pct+'%'; });
  const simEl = $('#sim');
  if(simEl){
    const upd = ()=>{
      const v = Number(simEl.value); simVal = v;
      const n = Math.ceil(c.remaining / v);
      const from = c.nextUp || ymNow();
      const fin = addMonths(from, n-1);
      const baseN = S.monthly ? Math.ceil(c.remaining / S.monthly) : null;
      $('#simLabel').textContent = fmt(v) + ' 元';
      $('#simOut').innerHTML = `再 <b>${n}</b> 期，<b>${ymDisp(fin)}</b> 還清` + (baseN && baseN!==n ? `（比每月 ${fmt(S.monthly)} ${n<baseN?'提早':'晚'} ${Math.abs(baseN-n)} 期）` : '');
    };
    simEl.oninput = upd; upd();
  }
  document.querySelectorAll('.slot.tap').forEach(el=> el.onclick = ()=> openSheet(el.dataset.ym, c));
  document.querySelectorAll('.tabs button').forEach(b=> b.onclick = ()=>{ chartTab = b.dataset.tab; render(); });
  const more = $('#btnMore'); if(more) more.onclick = ()=>{ showAll = !showAll; render(); };
  $('#btnShareAny').onclick = ()=> openShare(null, c);
  justStamped = null;
}

/* ── 打卡 ── */
function openSheet(ym, c){
  const sel = $('#fPeriod'); sel.innerHTML = '';
  c.months.forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=ymDisp(m); sel.appendChild(o); });
  sel.value = ym;
  $('#fDate').value = ymdNow();
  const owed = S.monthly ? Math.max(S.monthly - (c.byPeriod[ym]||0), 0) : '';
  $('#fAmount').value = owed || '';
  $('#fNote').value = ''; $('#fPin').value = ''; $('#fErr').textContent = '';
  $('#sheetTitle').textContent = `${ymDisp(ym)} 這期匯了多少？`;
  $('#mask').classList.add('open');
  setTimeout(()=> $('#fAmount').focus(), 50);
}
$('#btnX').onclick = ()=> $('#mask').classList.remove('open');
$('#mask').onclick = e=>{ if(e.target.id==='mask') $('#mask').classList.remove('open'); };

$('#btnGo').onclick = async ()=>{
  const body = {
    action:'checkin',
    pin: $('#fPin').value.trim(),
    date: $('#fDate').value,
    period: $('#fPeriod').value,
    amount: Number($('#fAmount').value),
    note: $('#fNote').value.trim(),
  };
  if(!body.amount || body.amount<=0){ $('#fErr').textContent='請填金額'; return; }
  if(!body.pin){ $('#fErr').textContent='請輸入 PIN'; return; }
  const btn = $('#btnGo'); btn.disabled = true; btn.textContent = '蓋章中…'; $('#fErr').textContent='';
  try{
    const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
    const data = await res.json();
    if(!data.ok) throw new Error(data.error||'失敗');
    R = data.records; justStamped = body.period;
    $('#mask').classList.remove('open');
    render();
    toast(`已蓋章 ${fmt(body.amount)} 元，剩餘 ${fmt(data.remaining)} 元`);
    setTimeout(()=> openShare({period: body.period, amount: body.amount}, compute()), 800);
  }catch(err){
    $('#fErr').textContent = String(err.message||err);
  }finally{ btn.disabled=false; btn.textContent='蓋章打卡'; }
};

/* ── 傳給爸爸 ── */
function buildMessage(just, c){
  const lines = [];
  if(just) lines.push(`${S.lender}，${ymDisp(just.period)} 這期的 ${fmt(just.amount)} 元已經匯給你了。`);
  else lines.push(`${S.lender}，還款進度給你看一下。`);
  lines.push(`目前已還 ${fmt(c.paid)} 元，剩餘 ${fmt(c.remaining)} 元。`);
  if(c.finishMonth) lines.push(`照這樣預計 ${ymDisp(c.finishMonth)} 還清。`);
  if(c.remaining===0) lines.push('全部還清了，謝謝你。');
  lines.push('');
  lines.push('每一期的紀錄都在這裡，點開就看得到：');
  lines.push(PAGE_URL);
  return lines.join('\n');
}
function openShare(just, c){
  $('#shareTitle').textContent = `傳給${S.lender}`;
  $('#shareText').value = buildMessage(just, c);
  $('#btnShare').style.display = navigator.share ? '' : 'none';
  $('#shareMask').classList.add('open');
}
$('#btnShareX').onclick = ()=> $('#shareMask').classList.remove('open');
$('#shareMask').onclick = e=>{ if(e.target.id==='shareMask') $('#shareMask').classList.remove('open'); };
$('#btnLine').onclick = ()=>{
  window.open('https://line.me/R/share?text=' + encodeURIComponent($('#shareText').value), '_blank');
};
$('#btnShare').onclick = async ()=>{ try{ await navigator.share({ text: $('#shareText').value }); }catch(_){} };
$('#btnCopy').onclick = async ()=>{
  const ta = $('#shareText');
  try{ await navigator.clipboard.writeText(ta.value); }catch(_){ ta.select(); document.execCommand('copy'); }
  toast('已複製，到 LINE 貼上就好');
};

/* ── 數據圖（純 SVG，不用外掛） ── */
function drawChart(tab, c){
  const W=520, H=260, L=54, Rm=14, T=18, B=44;
  const iw=W-L-Rm, ih=H-T-B;
  const k = n => n>=10000 ? (n/10000).toFixed(n%10000?1:0)+'萬' : fmt(n);
  const axis = (max, ticks=4) => { let out=''; for(let i=0;i<=ticks;i++){ const v=max*i/ticks, y=T+ih-ih*i/ticks; out+=`<line x1="${L}" x2="${W-Rm}" y1="${y}" y2="${y}" stroke="#E6DCC4" stroke-width="1"/><text x="${L-6}" y="${y+4}" font-size="10" fill="#A3A6A8" text-anchor="end">${k(v)}</text>`; } return out; };
  const svg = inner => `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const empty = svg(`<text x="${W/2}" y="${H/2}" font-size="13" fill="#A3A6A8" text-anchor="middle">還沒有資料，蓋第一個章後就會出現</text>`);

  if(tab==='month'){
    // 從起始月到現在（或最後一筆），每月還了多少；多還的月份用玫瑰色標記
    const months = c.months.filter(ym => ymCmp(ym, c.now)<=0 || (c.byPeriod[ym]||0)>0);
    if(!R.length) return empty;
    const vals = months.map(ym=>c.byPeriod[ym]||0);
    const max = Math.max(...vals, S.monthly||0, 1);
    const bw = Math.min(34, iw/months.length*0.6), gap = iw/months.length;
    let bars='';
    months.forEach((ym,i)=>{
      const v=vals[i], h=ih*v/max, x=L+gap*i+(gap-bw)/2, y=T+ih-h;
      const col = v===0 ? '#E6DCC4' : (S.monthly && v>S.monthly ? '#C9706C' : '#5F8C74');
      bars += `<rect x="${x}" y="${v?y:T+ih-3}" width="${bw}" height="${v?h:3}" rx="4" fill="${col}"/>`;
      if(v) bars += `<text x="${x+bw/2}" y="${y-5}" font-size="10" fill="#2B3238" text-anchor="middle">${k(v)}</text>`;
      if(months.length<=8 || i%Math.ceil(months.length/8)===0) bars += `<text x="${x+bw/2}" y="${H-B+16}" font-size="10" fill="#6B6F72" text-anchor="middle">${ym.slice(2).replace('-','/')}</text>`;
    });
    const ref = S.monthly ? `<line x1="${L}" x2="${W-Rm}" y1="${T+ih-ih*S.monthly/max}" y2="${T+ih-ih*S.monthly/max}" stroke="#D39B2E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${T+ih-ih*S.monthly/max+12}" font-size="10" fill="#D39B2E">每月 ${fmt(S.monthly)}</text>` : '';
    const avg = Math.round(c.paid / Math.max(1, months.filter(m=>(c.byPeriod[m]||0)>0).length));
    return svg(axis(max)+ref+bars) + `<div class="chartNote">綠色是當月還款，${S.monthly?'超過每月應還的用玫瑰色，':''}灰色是那個月沒還。有還款的月份平均 <b>${fmt(avg)}</b> 元。</div>`;
  }

  if(tab==='cum'){
    if(!R.length) return empty;
    const months = c.months.filter(ym => ymCmp(ym, c.now)<=0 || (c.byPeriod[ym]||0)>0);
    let acc=0; const pts = months.map((ym,i)=>{ acc += c.byPeriod[ym]||0; return {ym, paid:acc, left:S.total-acc}; });
    const max = S.total || 1, gap = iw/Math.max(1, months.length-1);
    const X = i => months.length===1 ? L+iw/2 : L+gap*i;
    const Y = v => T+ih-ih*Math.min(v,max)/max;
    const path = key => pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p[key])}`).join(' ');
    const area = `M${X(0)},${T+ih} ` + pts.map((p,i)=>`L${X(i)},${Y(p.paid)}`).join(' ') + ` L${X(pts.length-1)},${T+ih} Z`;
    let labels='';
    months.forEach((ym,i)=>{ if(months.length<=8 || i%Math.ceil(months.length/8)===0 || i===months.length-1) labels+=`<text x="${X(i)}" y="${H-B+16}" font-size="10" fill="#6B6F72" text-anchor="middle">${ym.slice(2).replace('-','/')}</text>`; });
    const last = pts[pts.length-1];
    const dots = `<circle cx="${X(pts.length-1)}" cy="${Y(last.paid)}" r="4" fill="#5F8C74"/><circle cx="${X(pts.length-1)}" cy="${Y(last.left)}" r="4" fill="#C9706C"/>`;
    const leg = `<text x="${L+iw/2-30}" y="${T+ih+12+18}" font-size="10" fill="#5F8C74" text-anchor="end">— 已還</text><text x="${L+iw/2+30}" y="${T+ih+12+18}" font-size="10" fill="#C9706C" text-anchor="start">— 剩餘</text>`;
    const proj = (c.finishMonth && S.monthly) ? `<div class="chartNote">兩條線交會的那個月，就是還了一半的時候；照每月 ${fmt(S.monthly)} 走，預計 <b>${ymDisp(c.finishMonth)}</b> 剩餘歸零。</div>` : `<div class="chartNote">綠線往上、玫瑰線往下，交會時就是還了一半。</div>`;
    return svg(axis(max)+`<path d="${area}" fill="#5F8C74" opacity=".12"/><path d="${path('paid')}" fill="none" stroke="#5F8C74" stroke-width="2.5"/><path d="${path('left')}" fill="none" stroke="#C9706C" stroke-width="2.5"/>`+dots+labels+leg) + proj;
  }

  // year
  if(!R.length) return empty;
  const byYear = {}; R.forEach(r=>{ const y=r.period.slice(0,4); byYear[y]=(byYear[y]||0)+r.amount; });
  const years = Object.keys(byYear).sort();
  const cnt = {}; R.forEach(r=>{ const y=r.period.slice(0,4); (cnt[y]=cnt[y]||new Set()).add(r.period); });
  const max = Math.max(...years.map(y=>byYear[y]), 1);
  const gap = iw/years.length, bw = Math.min(90, gap*0.55);
  let bars='';
  years.forEach((y,i)=>{ const v=byYear[y], h=ih*v/max, x=L+gap*i+(gap-bw)/2, yy=T+ih-h;
    bars += `<rect x="${x}" y="${yy}" width="${bw}" height="${h}" rx="6" fill="#5F8C74"/><text x="${x+bw/2}" y="${yy-6}" font-size="11" font-weight="700" fill="#2B3238" text-anchor="middle">${fmt(v)}</text><text x="${x+bw/2}" y="${H-B+16}" font-size="11" fill="#6B6F72" text-anchor="middle">${y} 年</text><text x="${x+bw/2}" y="${H-B+30}" font-size="10" fill="#A3A6A8" text-anchor="middle">${cnt[y].size} 期</text>`; });
  return svg(axis(max)+bars) + `<div class="chartNote">每年還了多少、幾期。年份會隨紀錄自動增加。</div>`;
}

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3200); }
function escape(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>
</body>
